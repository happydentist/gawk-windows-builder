name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編編譯 Job (官方 Native MinGW 完美線路)
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch GNU Awk Source via Master Branch
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'master'
          path: 'upstream/gawk'

      - name: Cache MSYS2 and MinGW Toolchain
        id: msys2-cache
        uses: actions/cache@v4
        with:
          path: |
            D:\a\_temp\msys64
            C:\msys64
          key: msys2-mingw64-v3-native-gcc-zip

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            make mingw-w64-x86_64-toolchain zip

      # 💡 核心編譯步驟：完全不跑 configure，純本地物理對齊 Windows 原生環境定義
      - name: Run Windows Native Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 準備 Windows 官方移植層檔案 ==="
          cd "$SRC"
          
          # 1. 依據官方指引，將 pc/ 內部的所有 Windows 相容層程式碼拷貝至根目錄
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 2. 💡 終極關鍵：物理填補 Makefile 的依賴死穴！
          # 直接把內建的 support/regex.h 複製到根目錄，並把專為 Windows 設計的 pc/config.h 也複製到根目錄。
          # 這能 100% 繞過 configure，且消滅 No rule to make target 'regex.h' 錯誤！
          cp support/regex.h ./regex.h
          cp pc/config.h ./config.h
          
          echo "=== 2. 執行 Windows 專用 Makefile 原生編譯 ==="
          # 💡 呼叫 pc/Makefile 的 mingw32 目錄，
          # 注入 LF2="-lws2_32" 強制連結 Windows 網路庫，解決 io.c 的所有通訊符號錯誤！
          make -f pc/Makefile mingw32 \
            CC=gcc \
            O=.o \
            CF="-O2 -std=gnu89 -fpermissive -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3" LF2="-lws2_32" RSP=

      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
