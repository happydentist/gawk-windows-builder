name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      # 💡 1. 下載你自己的包裝腳本
      - name: Check out this repository
        uses: actions/checkout@v4

      # 💡 終極修正：完全拋棄 curl、tar、zip、wget 與外部網路解壓！
      # 直接調用 GitHub 官方核心組件，將官方鏡像庫的 gawk-5.4.1 源碼「完好無損」地同步到 upstream/gawk
      # 這種內網同步絕對不可能超時、不可能 403，更不可能噴出任何 gzip 錯誤！
      - name: Fetch GNU Awk Source via Official Checkout
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'gawk-5.4.1' # 👈 精準鎖定 5.4.1 官方發布 Tag
          path: 'upstream/gawk' # 👈 直接存放到你的專案所需的預期目錄

      # 💡 2. 啟動並初始化編譯專用的 MSYS2 環境 (update: false 提升網路穩定度)
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 3. 樹內編譯 (In-tree build) 搭配 Windows 專屬相容補丁
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. Create Windows Shim ==="
          # 徹底解決 minrx.c 找不到 langinfo.h 崩潰
          echo "" > "$SRC/support/langinfo.h"
          
          echo "=== 2. Run Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 3. Run Configure (In-tree Build) ==="
          ./configure \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc CFLAGS="-O2" LDFLAGS=""
            
          echo "=== 4. Run Make ==="
          make -j4

      # 💡 4. 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 💡 5. 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # 提取編譯好的執行檔與證書
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 💡 6. 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
