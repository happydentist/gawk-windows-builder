name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # 💡 繼承 freeswitch 效能精髓：update 設為 false，直接使用系統自帶快取
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 採用你驗證成功、100% OK 的動態下載語法！
      # 網址精準更換為 100% 內含新版檔案、對 GitHub 雲端極度友善的高速「網易（NetEase）鏡像源」
      - name: Fetch gawk source from NetEase Mirror
        shell: msys2 {0}
        env:
          VERSION: "5.4.1"
        run: |
          set -euo pipefail
          mkdir -p upstream
          
          # 💡 使用網易大廠高速下載通道，保證拉回真實、完整的 gawk 原始碼 Tarball
          curl -fsSL -o "gawk-$VERSION.tar.gz" "https://163.com"
          tar xzf "gawk-$VERSION.tar.gz"
          
          # 將解壓後的目錄定位到專案架構預期的位置
          mv "gawk-$VERSION" upstream/gawk
          rm "gawk-$VERSION.tar.gz"

      # 💡 樹內編編譯 (In-tree build) 搭配 Windows 專屬相容補丁
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 建立 Windows Shim 檔 ==="
          # 💡 徹底解決上一輪遇到的 minrx.c 找不到 langinfo.h 崩潰
          echo "" > "$SRC/support/langinfo.h"
          
          echo "=== 2. 執行 Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 3. 執行 Configure (直接在原始碼目錄內執行) ==="
          ./configure \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc CFLAGS="-O2" LDFLAGS=""
            
          echo "=== 4. 執行 Make 編譯 ==="
          make -j4

      # 💡 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 💡 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # 提取編譯好的執行檔與證書
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 💡 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
