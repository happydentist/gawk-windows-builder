name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job (官方 Native MinGW 完美線路 + 全相容補丁)
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      # 1. 下載你自己的包裝腳本
      - name: Check out this repository
        uses: actions/checkout@v4

      # 2. 透過 GitHub 內網骨幹，直接把最新、最完整的原始碼檔案樹吐到 upstream/gawk
      - name: Fetch GNU Awk Source via Master Branch
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'master'
          path: 'upstream/gawk'

      # 3. MSYS2 與 MinGW 套件高速快取機制
      - name: Cache MSYS2 and MinGW Toolchain
        id: msys2-cache
        uses: actions/cache@v4
        with:
          path: |
            D:\a\_temp\msys64
            C:\msys64
          key: msys2-mingw64-v3-native-gcc-zip

      # 4. 啟動並初始化編譯專用的 MSYS2 環境 (快取命中時一秒跳過安裝)
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            make mingw-w64-x86_64-toolchain zip

      # 💡 5. 採用 GNU 官方標準的 Windows 原生移植編譯線路（配合全域標頭檔填補）
      - name: Run Windows Native Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 準備 Windows 官方移植層檔案 ==="
          cd "$SRC"
          
          # 1. 依據官方指引，將 pc/ 內部的所有 Windows 相容層程式碼拷貝至根目錄
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 2. 把 support/ 資料夾內的所有標頭檔 (*.h) 一口氣全部複製到根目錄，消滅找不到依賴的 Makefile 頑疾
          cp support/*.h .
          cp pc/config.h ./config.h
          
          echo "=== 2. 執行 Windows 專用 Makefile 原生編譯 ==="
          # 💡 終極關鍵修復：直接在 make 命令尾端將 CF 變數徹底強制覆蓋！
          # 這能防止 Makefile 內部的硬編碼把我們的引數刷掉。
          # 同時掛載 -DBOOL=GAWK_BOOL 與 -D_MINWINDEF_H，將微軟的 typedef int BOOL 完全屏蔽阻斷！
          make -f pc/Makefile mingw32 \
            CC=gcc \
            O=.o \
            LNK=LMINGW32 PLNK=PLMINGW32 \
            CF="-D__USE_MINGW_ANSI_STDIO -O2 -std=gnu89 -fpermissive -DBOOL=GAWK_BOOL -D_MINWINDEF_H -D_WINDEF_H -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            LF="-gdwarf-2 -g3" LF2="-lws2_32" RSP=

      # 6. 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 7. 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 8. 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
