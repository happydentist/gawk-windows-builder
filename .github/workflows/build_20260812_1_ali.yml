name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # 💡 繼承 freeswitch 效能精髓：update 設為 false，直接使用系統自帶快取
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 終極修正：拋棄任何外部伺服器！直接去 GitHub 官方鏡像的 Release 抓取 gawk-5.4.1.tar.gz 壓縮包。
      # GitHubActions 互連 100% 不會超時，也絕對不可能被 403 阻擋，拉回來的絕對是貨真價實的原始碼！
      - name: Fetch gawk source from GitHub Releases
        shell: msys2 {0}
        env:
          VERSION: "5.4.1"
        run: |
          set -euo pipefail
          mkdir -p upstream
          
          # 💡 調用 GitHub 官方非官方鏡像的原始碼下載點，安全且極速
          curl -fsSL -o "gawk-$VERSION.tar.gz" "https://github.com"
          tar xzf "gawk-$VERSION.tar.gz"
          
          # GitHub 壓縮包解壓後目錄名為 gawk-gawk-5.4.1，將其精準定位
          mv "gawk-gawk-$VERSION" upstream/gawk
          rm "gawk-$VERSION.tar.gz"

      # 💡 樹內編編譯 (In-tree build) 搭配 Windows 專屬相容補丁
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 建立 Windows Shim 檔 ==="
          # 💡 徹底解決 minrx.c 找不到 langinfo.h 崩潰
          echo "" > "$SRC/support/langinfo.h"
          
          echo "=== 2. 執行 Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 3. 執行 Configure (樹內原生編譯) ==="
          ./configure \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc CFLAGS="-O2" LDFLAGS=""
            
          echo "=== 4. 執行 Make 編譯 ==="
          make -j4

      # 💡 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 💡 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # 提取編譯好的執行檔與證書
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 💡 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
