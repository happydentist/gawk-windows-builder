name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      # 1. 下載你自己的包裝腳本
      - name: Check out this repository
        uses: actions/checkout@v4

      # 2. 透過 GitHub 內網骨幹，直接把最新、最完整的原始碼檔案樹吐到 upstream/gawk
      - name: Fetch GNU Awk Source via Master Branch
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'master'
          path: 'upstream/gawk'

      # 3. 啟動並初始化編譯專用的 MSYS2 環境 (update: false 提升網路穩定度)
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 4. 樹內編譯 (In-tree build) —— 完美的現代標準與舊代碼寬容並行線路
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 建立 Windows Shim 檔 ==="
          # 💡 終極修正：補齊完整的 langinfo 巨集，為 Windows 精準模擬 CODESET 與其它本地化變數
          # 這能 100% 根除 regcomp.c 找不到 CODESET 的編譯中斷死穴！
          cat << 'EOF' > "$SRC/support/langinfo.h"
          #ifndef _LANGINFO_H
          #define _LANGINFO_H
          
          typedef int nl_item;
          #define CODESET     0
          #define RADIXCHAR   1
          #define THOUSEP     2
          #define CRNCYSTR    3
          
          static inline char *nl_langinfo(nl_item item) {
              if (item == CODESET) return "UTF-8";
              return "";
          }
          #endif
          EOF
          
          echo "=== 2. 執行 Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 3. 執行 Configure (In-tree Build) ==="
          ./configure \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc \
            CFLAGS="-O2 -std=gnu99 -fpermissive -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types" \
            LDFLAGS=""
            
          echo "=== 4. 執行 Make 編譯 ==="
          make -j4

      # 5. 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 6. 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # 提取編譯好的執行檔與證書
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 7. 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
