name: build-gawk-windows-freeswitch-style_v1_ali

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job (官方 Native MinGW 完美線路 + 全相容補丁)
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      # 1. 下載你自己的包裝腳本
      - name: Check out this repository
        uses: actions/checkout@v4

      # 2. 透過 GitHub 內網骨幹，直接把最新、最完整的原始碼檔案樹吐到 upstream/gawk
      - name: Fetch GNU Awk Source via Master Branch
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'master'
          path: 'upstream/gawk'

      # 3. MSYS2 與 MinGW 套件高速快取機制
      - name: Cache MSYS2 and MinGW Toolchain
        id: msys2-cache
        uses: actions/cache@v4
        with:
          path: |
            D:\a\_temp\msys64
            C:\msys64
          key: msys2-mingw64-v3-native-gcc-zip

      # 4. 啟動並初始化編譯專用的 MSYS2 環境 (快取命中時一秒跳過安裝)
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            make mingw-w64-x86_64-toolchain zip

      # 💡 5. 採用 GNU 官方標準的 Windows 原生移植編譯線路
      - name: Run Windows Native Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 準備 Windows 官方移植層檔案 ==="
          cd "$SRC"
          
          # 1. 💡 物理修正 1：利用 sed 將原始碼資料夾內所有包含副檔名為 .c 或 .h 的檔案（包含 awk.h, builtin.c 等），
          # 內置的 BOOL 巨集與列舉成員同步強行更名為 GAWK_BOOL。
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\bBOOL\b/GAWK_BOOL/g' {} +
          
          # 2. 💡 物理修正 2：利用 sed 將 pc/gawkmisc.pc 中與系統重複定義、導致衝突的 wctob 函數直接註解掉
          sed -i '/int\s*wctob/,/}/ s/^/\/\//' pc/gawkmisc.pc
          
          # 3. 依據官方指引，將 pc/ 內部的所有 Windows 相容層程式碼拷貝至根目錄
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 4. 把 support/ 資料夾內的所有標頭檔 (*.h) 一口氣全部複製到根目錄，消滅找不到依賴的 Makefile 頑疾
          cp support/*.h .
          cp pc/config.h ./config.h
          
          # 5. 💡 終極關鍵修復：手動在當前根目錄建立一個 malloc/ 子資料夾，
          # 並把 support/malloc/ 底下的核心標頭檔全部複製進去。
          # 這能 100% 物理性解決 No rule to make target 'malloc/dynarray.h' 錯誤！
          mkdir -p malloc
          cp support/malloc/*.h ./malloc/
          
          echo "=== 2. 執行 Windows 專用 Makefile 原生編譯 ==="
          # 💡 所有依賴結構已被完全對齊，我們直接繞過遞迴，全速向 'all' 標籤發動總攻！
          make -f pc/Makefile all \
            CC=gcc \
            O=.o \
            LNK=LMINGW32 PLNK=PLMINGW32 \
            CF="-D__USE_MINGW_ANSI_STDIO -O2 -std=gnu89 -fpermissive -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            LF="-gdwarf-2 -g3" LF2="-lws2_32" RSP=

      # 6. 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 7. 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 8. 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
