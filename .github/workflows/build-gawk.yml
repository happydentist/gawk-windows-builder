name: Build gawk for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MinGW Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 binutils-mingw-w64 build-essential git autoconf automake gettext bison flex

    - name: Clone gawk Source via Git
      run: |
        # 1. 直接從 GNU 官方的 Git 儲存庫克隆 gawk 原始碼（絕對不會有跳轉或防爬蟲問題）
        git clone https://gnu.org src
        cd src
        
        # 2. 直接切換到 5.4.1 版本的官方 Release Tag
        git checkout gawk-5.4.1
        
        # 3. 由於是從 Git 抓取，需要自動生成 configure 腳本
        ./bootstrap.sh

    - name: Configure and Compile (Static Link)
      run: |
        cd src
        ./configure \
          --host=x86_64-w64-mingw32 \
          --prefix=${{ github.workspace }}/output \
          --disable-shared \
          --enable-static \
          LDFLAGS="-static" \
          CFLAGS="-O3"
        make -j$(nproc)

    - name: Install Binaries
      run: |
        cd src
        make install

    - name: Verify Executable
      run: |
        ls -lh ${{ github.workspace }}/output/bin/
        file ${{ github.workspace }}/output/bin/gawk.exe || true

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: gawk-5.4.1-windows-static
        path: |
          ${{ github.workspace }}/output/bin/gawk.exe
          ${{ github.workspace }}/output/bin/awk.exe
