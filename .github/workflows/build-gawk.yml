name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch and Expand Source via GitHub CDN
        shell: bash
        run: |
          set -euo pipefail
          # 改用 GitHub 官方核心 CDN 機房直連下載（100% 免疫 gnu.org 網路阻斷）
          curl -fsSL -o "gawk-5.4.1.tar.gz" "https://github.com"
          tar -xf gawk-5.4.1.tar.gz
          # 將解壓後的目錄名稱重新命名，以完美接軌 freeswitch 的後續編譯路徑
          mv gawk-gawk-5.4.1 gawk-5.4.1

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Build gawk.exe (Static Build)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          mkdir -p shim
          echo '#define CODESET 0' > shim/langinfo.h
          echo 'char *nl_langinfo(int item) { return "UTF-8"; }' >> shim/langinfo.h
          cp shim/langinfo.h .
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            exit 1
          fi

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "GNU awk 5.4.1 native static windows binary." \
            dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt || true
