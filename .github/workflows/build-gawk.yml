name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # 1. 關鍵：使用 Windows 原生的 PowerShell 進行直連下載與解壓
      # 這完全走 Windows 內部優化通道，100% 避開 MSYS2 環境下的 gzip 格式解析錯誤
      - name: Fetch and Expand Source Natively
        shell: powershell
        run: |
          $url = "https://kernel.org"
          Write-Host "正在下載 gawk 5.4.1..."
          Invoke-WebRequest -Uri $url -OutFile "gawk-5.4.1.tar.gz"
          
          Write-Host "正在使用 Windows 原生工具解壓..."
          # Windows 內建的 tar 可以完美自動識別格式並安全還原成資料夾
          tar -xf gawk-5.4.1.tar.gz

      # 2. 安裝與配置 MSYS2 / MinGW-w64 編譯環境
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      # 3. 繼承 freeswitch 的精髓進行 Windows 原生編譯
      - name: Build gawk.exe (Static Build)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 複製 pc 移植目錄檔案
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 建立最小的 langinfo 兼容標頭檔
          mkdir -p shim
          echo '#define CODESET 0' > shim/langinfo.h
          echo 'char *nl_langinfo(int item) { return "UTF-8"; }' >> shim/langinfo.h
          cp shim/langinfo.h .
          
          # 執行編譯（-static 參數實現完全靜態連結，免除所有運行庫 DLL）
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      # 4. 功能測試
      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          
          # 驗證是否成功排除 MSYS/Cygwin 依賴
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            echo "::error::gawk.exe 依賴了非原生的運行庫 DLL！"
            exit 1
          fi

      # 5. 打包產物
      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt

      # 6. 自動上傳到你專案的 Release 頁面
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "基於 freeswitch 架構並結合 Windows 原生下載解壓流程成功編譯的 GNU awk 5.4.1 原生靜態版本。" \
            dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt || true
