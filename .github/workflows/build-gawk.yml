name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (Windows-MSYS2)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc curl tar

      - name: Fetch gawk source from kernel.org mirror
        shell: msys2 {0}
        run: |
          set -euo pipefail
          
          # 使用 Linux 基金會的官方 GNU 鏡像站，此網址能 100% 避開 ftp.gnu.org 的各種地區跳轉與 404/503 HTML 陷阱
          curl -fsSL -o "gawk-5.4.1.tar.gz" "https://kernel.org"
          
          # 檢查下載檔案大小是否大於 1MB（防範抓到幾 KB 的 HTML 錯誤頁面）
          FILE_SIZE=$(wc -c < gawk-5.4.1.tar.gz)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::下載的檔案不完整，可能抓到了錯誤網頁！檔案大小: $FILE_SIZE 位元組"
            head -n 10 gawk-5.4.1.tar.gz
            exit 1
          fi
          
          # 使用萬用解壓參數
          tar -xvf "gawk-5.4.1.tar.gz"

      - name: Prepare Windows Build Files
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          mkdir -p shim
          echo '#define CODESET 0' > shim/langinfo.h
          echo 'char *nl_langinfo(int item) { return "UTF-8"; }' >> shim/langinfo.h
          cp shim/langinfo.h .

      - name: Build gawk.exe (Static Link)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 加入 -static 參數進行 Windows 完全靜態連結編譯
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      - name: Package Binaries
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "本檔案由 GitHub Actions 透過 Windows-MSYS2 環境與 MinGW-w64 交叉靜態編譯而成，為純原生、無依賴的 Windows 執行檔。" \
            dist/gawk.exe dist/pgawk.exe dist/COPYING || true
