name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      # 1. 修正：精確指定 refs/tags/ 前綴，告訴 Git 這是標籤，非分支
      - name: Fetch gawk 5.4.1 source natively
        uses: actions/checkout@v4
        with:
          repository: 'gnu-mirror-unofficial/gawk'
          ref: 'refs/tags/gawk-5.4.1'
          path: 'gawk-5.4.1'

      # 2. 簽出目前專案環境（供後續 Release 腳本辨識）
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          path: 'repo'

      # 3. 配置 Windows 的 MSYS2 與編譯工具鏈
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      # 4. 執行與 freeswitch 完全相同的 Windows 原生編譯
      - name: Build gawk.exe (Static Build)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 複製 pc 移植目錄檔案
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 建立最小的 langinfo 兼容標頭檔
          mkdir -p shim
          echo '#define CODESET 0' > shim/langinfo.h
          echo 'char *nl_langinfo(int item) { return "UTF-8"; }' >> shim/langinfo.h
          cp shim/langinfo.h .
          
          # 執行編譯（包含 -static 完全靜態連結，免除 runtime DLL）
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      # 5. 功能測試
      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          
          # 驗證是否成功排除 MSYS/Cygwin 依賴
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            echo "::error::gawk.exe 依賴了非原生的運行庫 DLL！"
            exit 1
          fi

      # 6. 打包產物
      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt

      # 7. 自動上傳到你專案的 Release 頁面
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "採用全 GitHub 內部網域直接同步並基於 MinGW-w64 靜態編譯而成的純原生 Windows 版 gawk.exe。" \
            dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt || true
