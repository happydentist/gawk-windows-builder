name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build gawk.exe (MinGW-w64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -xf gawk-5.4.1.tar.gz
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - shell: msys2 {0}
        run: |
          cd gawk-5.4.1
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          cp pc/config.h .
          cp support/*.h .
          cp support/*.c .
          mkdir -p malloc && cp support/malloc/* malloc/
          sed -i 's/__mb_cur_max/MB_CUR_MAX/g' pc/nl_langinfo.c
          sed -i 's/#define strftime rpl_strftime/\/* #define strftime rpl_strftime *\//g' config.h
          echo "#define HAVE_STRFTIME 1" >> config.h
          sed -i 's/#define HAVE_STRCOLL 0/#define HAVE_STRCOLL 1/g' config.h
          echo "" > missing_d/strcoll.c
          # 編譯必要物件
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_resize.c
          # ... (省略其他編譯步驟，使用優化參數與現代化靜態連結)
          make all CC=gcc O=.o LF="-static -s" LF2="-lws2_32"
      - run: |
          cd gawk-5.4.1
          strip gawk.exe
          mkdir -p ../dist && cp gawk.exe ../dist/
      - uses: actions/upload-artifact@v4
        with:
          path: dist/gawk.exe
