name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Expand Local Source
        shell: bash
        run: |
          set -euo pipefail
          tar -xf gawk-5.4.1.tar.gz

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Build gawk.exe (Static Build)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 1. 複製官方 pc/ 目錄下的 Windows 專用移植檔到根目錄
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          cp pc/config.h .
          
          # 2. 將 support/ 目錄下的所有 .h 標頭檔投射到根目錄
          cp support/*.h .
          
          # 3. 【核心修正：解決 malloc/ 內部所有 .h 與 .c 相依檔缺失】
          # 不只複製標頭檔，直接將整個 support/malloc/ 底下的檔案完整投射到根目錄的 malloc 資料夾
          # 這能 100% 根除 "No rule to make target 'malloc/dynarray-skeleton.c'" 的編譯死結！
          mkdir -p malloc
          cp support/malloc/* malloc/
          
          # 4. 【核心除錯 1】修正新版 GCC 對舊式微軟運行庫變數的相容性錯誤
          sed -i 's/__mb_cur_max/MB_CUR_MAX/g' pc/nl_langinfo.c
          
          # 5. 【核心除錯 2】全面封印過時的 rpl_strftime，強制採用 Windows 原生標準 time.h 函數
          sed -i 's/#define strftime rpl_strftime/\/* #define strftime rpl_strftime *\//g' config.h
          echo "#define HAVE_STRFTIME 1" >> config.h
          
          # 6. 依照 Windows-MSYS2 環境執行完全靜態連結原生編譯
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            exit 1
          fi

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "GNU awk 5.4.1 native static windows binary built with modern MinGW-w64." \
            dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt || true
