name: Build gawk for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MinGW Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 binutils-mingw-w64 build-essential curl xz-utils

    - name: Download gawk 5.4.1 Source
      run: |
        # 改用國際頂級 Yandex CDN 鏡像站，確保 GitHub 歐美虛擬機 100% 可解析 DNS
        curl -L -o gawk-5.4.1.tar.xz https://yandex.ru
        
        # 檢查下載檔案體積（正式包約為 3.7MB，至少需大於 1MB）
        FILE_SIZE=$(wc -c < gawk-5.4.1.tar.xz)
        if [ "$FILE_SIZE" -lt 1000000 ]; then
          echo "錯誤：下載的檔案太小 ($FILE_SIZE 流量)，可能抓錯了！"
          head -n 5 gawk-5.4.1.tar.xz
          exit 1
        fi
        
        tar -xf gawk-5.4.1.tar.xz

    - name: Configure and Compile (Static Link)
      run: |
        cd gawk-5.4.1
        ./configure \
          --host=x86_64-w64-mingw32 \
          --prefix=${{ github.workspace }}/output \
          --disable-shared \
          --enable-static \
          LDFLAGS="-static" \
          CFLAGS="-O3"
        make -j$(nproc)

    - name: Install Binaries
      run: |
        cd gawk-5.4.1
        make install

    - name: Verify Executable
      run: |
        ls -lh ${{ github.workspace }}/output/bin/
        file ${{ github.workspace }}/output/bin/gawk.exe || true

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: gawk-5.4.1-windows-static
        path: |
          ${{ github.workspace }}/output/bin/gawk.exe
          ${{ github.workspace }}/output/bin/awk.exe
