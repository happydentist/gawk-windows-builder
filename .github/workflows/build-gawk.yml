name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Fetch gawk source from reliable mirror
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # 保留 freeswitch 的 curl 與 tar.gz 邏輯
          # 改用核心 Linux 基金會的官方鏡像，確保 100% 避開 GitHub 機房被 gnu.org 阻斷的問題
          curl -fsSL -o "gawk-5.4.1.tar.gz" "https://kernel.org"
          tar xzf "gawk-5.4.1.tar.gz"

      - name: Build gawk.exe (Static Build)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 複製 pc 移植目錄檔案
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          
          # 建立最小的 langinfo 兼容標頭檔
          mkdir -p shim
          echo '#define CODESET 0' > shim/langinfo.h
          echo 'char *nl_langinfo(int item) { return "UTF-8"; }' >> shim/langinfo.h
          cp shim/langinfo.h .
          
          # 執行編譯（此處在 LF 參數中增加了 -static 以實現完全靜態連結）
          make all \
            CC=gcc O=.o \
            CF="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3 -static" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          
          # 驗證是否成功排除 MSYS/Cygwin 依賴，成為純 Windows 靜態原生執行檔
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            echo "::error::gawk.exe 依賴了非原生的運行庫 DLL！"
            exit 1
          fi

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 在您的儲存庫 Release 頁面自動上傳與發布成品
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "基於 freeswitch 架構編譯的 GNU awk 5.4.1 靜態 Windows 版本。" \
            dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt || true
