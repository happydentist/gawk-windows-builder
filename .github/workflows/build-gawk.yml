name: Build gawk 5.4.1 for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Expand Local Source
        shell: bash
        run: |
          set -euo pipefail
          tar -xf gawk-5.4.1.tar.gz

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Build gawk.exe (Native Windows Optimization)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          
          # 1. 複製官方 pc/ 目錄下的 Windows 專用移植檔到根目錄
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          cp pc/config.h .
          
          # 2. 將 support/ 內部所有的結構和源代碼攤平到根目錄
          cp support/*.h .
          cp support/*.c .
          
          # 3. 完整投射整個 support/malloc/ 目計下的所有檔案
          mkdir -p malloc
          cp support/malloc/* malloc/
          
          # 4. 修正新版 GCC 對舊式微軟運行庫變數的相容性錯誤
          sed -i 's/__mb_cur_max/MB_CUR_MAX/g' pc/nl_langinfo.c
          
          # 5. 全面採用 Windows 原生 time.h 函數，解決 strftime 參數過多錯誤
          sed -i 's/#define strftime rpl_strftime/\/* #define strftime rpl_strftime *\//g' config.h
          echo "#define HAVE_STRFTIME 1" >> config.h
          
          # 6. 強制宣布 Windows 擁有原生的 strcoll 函數，根除 linker 重複定義錯誤
          sed -i 's/#define HAVE_STRCOLL 0/#define HAVE_STRCOLL 1/g' config.h
          echo "" > missing_d/strcoll.c
          
          # 7. 解決啟動死結，啟用原生 C32/Wctype 支援
          sed -i 's/#define HAVE_DLFCN_H 1/\/* #define HAVE_DLFCN_H 1 *\//g' config.h
          echo "#define HAVE_MBLEN 1" >> config.h
          echo "#define HAVE_MBRLEN 1" >> config.h
          echo "#define HAVE_ISWBLANK 1" >> config.h
          echo "#define HAVE_ISWCTYPE 1" >> config.h
          
          # 8. 手動編譯 pc/Makefile 遺漏定義的 dynarray 物件檔案
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_resize.c
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_emplace_enlarge.c
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_finalize.c
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_at_failure.c
          gcc -c -O2 -I. -I./support -DHAVE_CONFIG_H malloc/dynarray_resize_clear.c
          
          # 9. 【最核心修正：改變連結戰略】
          # 將 LF 改為 "-static-libgcc"，不再使用全靜態 "-static"！
          # 這能讓 gawk 完美動態連結 Windows 內建的 msvcrt.dll，徹底解放標準輸出流，解決本機啟動卡死！
          make all \
            CC=gcc O=.o \
            CF="-O2 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-static-libgcc" LF2="-lws2_32" RSP=

      - name: Native CMD Smoke Test
        shell: cmd
        run: |
          cd gawk-5.4.1
          :: 關鍵防禦：直接強迫在微軟原生命令提示字元 (CMD) 下執行驗證！
          :: 如果這裡成功吐出版本，就代表下載回你的實體電腦也絕對不會再卡死！
          gawk.exe --version

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "gawk-5.4.1"
          strip gawk.exe
          mkdir ../dist
          cp gawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe COPYING > sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v5.4.1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "gawk 5.4.1 for Windows" \
            --notes "GNU awk 5.4.1 native 64-bit windows binary optimized for standard Windows Console (CMD/PowerShell)." \
            dist/gawk.exe dist/COPYING dist/sha256sums.txt || true
