name: Build gawk for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # 改用官方鏡像站直連網址，繞過 ftp.gnu.org 的 Actions 跳轉機制
  GAWK_URL: "https://kernel.org"

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MinGW Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 binutils-mingw-w64 build-essential wget xz-utils

    - name: Download gawk 5.4.1 Source
      run: |
        # 使用 -L 參數強制追蹤任何潛在跳轉，並精確指定下載檔名
        wget -O gawk-5.4.1.tar.xz "${{ env.GAWK_URL }}"
        
        # 額外防護：檢查下載下來的是否為真正的壓縮檔（避免抓到 HTML）
        if ! file gawk-5.4.1.tar.xz | grep -q "XZ compressed data"; then
          echo "錯誤：下載的檔案不是有效的 XZ 壓縮檔！"
          cat gawk-5.4.1.tar.xz | head -n 5
          exit 1
        fi
        
        tar -xf gawk-5.4.1.tar.xz

    - name: Configure and Compile (Static Link)
      run: |
        cd gawk-5.4.1
        ./configure \
          --host=x86_64-w64-mingw32 \
          --prefix=${{ github.workspace }}/output \
          --disable-shared \
          --enable-static \
          LDFLAGS="-static" \
          CFLAGS="-O3"
        make -j$(nproc)

    - name: Install Binaries
      run: |
        cd gawk-5.4.1
        make install

    - name: Verify Executable
      run: |
        ls -lh ${{ github.workspace }}/output/bin/
        file ${{ github.workspace }}/output/bin/gawk.exe || true

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: gawk-5.4.1-windows-static
        path: |
          ${{ github.workspace }}/output/bin/gawk.exe
          ${{ github.workspace }}/output/bin/awk.exe
