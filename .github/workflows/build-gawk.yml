name: Build gawk for Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  mingw-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MinGW Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 binutils-mingw-w64 build-essential curl xz-utils

    - name: Download gawk 5.4.1 Source
      run: |
        # 直接使用 curl 下載直連檔案，避免 env 解析與任何跳轉問題
        curl -L -o gawk-5.4.1.tar.xz https://ntua.edu.tw
        
        # 檢查下載檔案大小是否正常（真的原始碼壓縮檔應該大於 3MB，如果是網頁 HTML 只有幾 KB）
        FILE_SIZE=$(wc -c < gawk-5.4.1.tar.xz)
        if [ "$FILE_SIZE" -lt 1000000 ]; then
          echo "錯誤：下載的檔案太小 ($FILE_SIZE 位元組)，可能又抓到網頁了！"
          head -n 10 gawk-5.4.1.tar.xz
          exit 1
        fi
        
        tar -xf gawk-5.4.1.tar.xz

    - name: Configure and Compile (Static Link)
      run: |
        cd gawk-5.4.1
        ./configure \
          --host=x86_64-w64-mingw32 \
          --prefix=${{ github.workspace }}/output \
          --disable-shared \
          --enable-static \
          LDFLAGS="-static" \
          CFLAGS="-O3"
        make -j$(nproc)

    - name: Install Binaries
      run: |
        cd gawk-5.4.1
        make install

    - name: Verify Executable
      run: |
        ls -lh ${{ github.workspace }}/output/bin/
        file ${{ github.workspace }}/output/bin/gawk.exe || true

    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: gawk-5.4.1-windows-static
        path: |
          ${{ github.workspace }}/output/bin/gawk.exe
          ${{ github.workspace }}/output/bin/awk.exe
