name: build-gawk-windows-freeswitch-style_v1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # 💡 關鍵修正 1：改用阿里雲（Alibaba）高速開源鏡像站的真實下載路徑！
      # 並且在安全穩定的 PowerShell 執行原生解壓，確保拉回來的 100% 是正確的 gawk 原始碼。
      - name: Download and Extract GNU Awk source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "upstream"
          Write-Host "正在從阿里雲高速鏡像下載 gawk-5.4.1.tar.gz..."
          
          # 精準的 Tarball 下載網址
          Invoke-WebRequest -Uri "https://aliyun.com" -OutFile "gawk-src.tar.gz"
          
          Write-Host "正在解壓縮原始碼..."
          tar -xzf gawk-src.tar.gz
          
          Write-Host "搬移目錄至專案指定位置..."
          Move-Item -Path "gawk-5.4.1" -Destination "upstream/gawk"
          Remove-Item -Path "gawk-src.tar.gz"
          
          Write-Host "檢查原始碼完整性（必須看到 configure.ac）："
          Get-ChildItem -Path "upstream/gawk/configure.ac"

      # 💡 繼承 freeswitch 精髓：update 設為 false，直接使用系統自帶快取，避免搶佔網路通道
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 關鍵修正 2：改回「樹內編譯 (In-tree build)」，直接在原始碼目錄內執行 ./configure，
      # 配合剛剛完整下載的原始碼，徹底消滅找不到 regex.h 的相對路徑 Bug。
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          
          echo "=== 1. 執行 Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 2. 執行 Configure (樹內原生編譯) ==="
          ./configure \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc CFLAGS="-O2" LDFLAGS=""
            
          echo "=== 3. 執行 Make 編譯 ==="
          make -j4

      # 💡 關鍵修正 3：對應樹內編譯的路徑，對產出的 gawk.exe 執行原生 Windows 冒煙測試
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./upstream/gawk/gawk.exe --version
          test "$(echo 'hello world' | ./upstream/gawk/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 💡 關鍵修正 4：從正確的 upstream/gawk 目錄內撈取編編譯產物打包
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          cd upstream/gawk
          strip gawk.exe
          cp gawk.exe ../../dist/
          cp COPYING ../../dist/
          
          cd ../../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 5. 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
