name: build-gawk-windows-freeswitch-style_v1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Windows x86_64 平台編譯 Job
  # =================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # 💡 繼承 freeswitch 網路精髓：在微軟最穩定的 PowerShell 環境下載，完全不透過 MSYS2，
      # 同時改用大廠高速學術鏡像 dotsrc，100% 避開 gnu.org 防火牆阻擋。
      - name: Download and Extract GNU Awk source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "upstream"
          Write-Host "正在下載 gawk-5.4.1.tar.gz..."
          Invoke-WebRequest -Uri "https://dotsrc.org" -OutFile "gawk-src.tar.gz"
          
          Write-Host "正在解壓縮原始碼..."
          tar -xzf gawk-src.tar.gz
          
          Write-Host "搬移目錄至專案指定位置..."
          Move-Item -Path "gawk-5.4.1" -Destination "upstream/gawk"
          Remove-Item -Path "gawk-src.tar.gz"
          
          Write-Host "原始碼準備完畢！"

      # 💡 繼承 freeswitch 效能精髓：update 設為 false，直接使用系統自帶快取，避免搶佔網路通道
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false 
          path-type: inherit
          install: >-
            git autoconf automake libtool make base-devel bison gettext gettext-devel xz zip
            mingw-w64-x86_64-toolchain

      # 💡 回歸標準 Autotools 編譯：透過跑 configure 自動產出 regex.h 還有對應 Makefile，
      # 並且關閉 extensions 以相容 Windows 沒有 dlfcn.h 的情況。
      - name: Run Autotools Build
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          
          ROOT="$(pwd)"
          SRC="$ROOT/upstream/gawk"
          BUILD_DIR="$ROOT/build"
          
          mkdir -p "$BUILD_DIR"
          
          echo "=== 1. 執行 Autoreconf ==="
          cd "$SRC"
          autoreconf -fi
          
          echo "=== 2. 執行 Configure ==="
          cd "$BUILD_DIR"
          "$SRC/configure" \
            --disable-dependency-tracking \
            --enable-shared \
            --disable-extensions \
            --with-readline \
            --with-mpfr \
            --enable-pma \
            --disable-silent-rules \
            CC=gcc CFLAGS="-O2" LDFLAGS=""
            
          echo "=== 3. 執行 Make 編譯 ==="
          make -j4

      # 💡 冒煙測試：確保 gawk.exe 能在 Windows 下被原生執行
      - name: Run Smoke Test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./build/gawk.exe --version
          test "$(echo 'hello world' | ./build/gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"

      # 💡 自動打包產物
      - name: Package Artifacts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # 提取編譯好的執行檔與證書
          cd build
          strip gawk.exe
          cp gawk.exe ../dist/
          cp ../upstream/gawk/COPYING ../dist/
          
          # 壓縮與計算校驗碼
          cd ../dist
          zip -r gawk-x86_64-windows.zip gawk.exe COPYING
          sha256sum gawk-x86_64-windows.zip > gawk-x86_64-windows.zip.sha256
          cat gawk-x86_64-windows.zip.sha256

      # 💡 一鍵推送到 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/gawk-x86_64-windows.zip
            dist/gawk-x86_64-windows.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
